name: CI

# Runs on every push and every pull request. Any failing step fails the workflow.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          # Caches npm's download cache only (~/.npm), never node_modules. `npm ci` below still deletes
          # node_modules and installs from the lockfile every time, so a stale cache can't hide a broken install.
          cache: npm

      - name: Install from the lockfile
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit and render tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Keep the build for the browser tests
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next
          include-hidden-files: true
          retention-days: 1

  browser:
    name: Browser smoke tests
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install from the lockfile
        run: npm ci

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: Download the build
        uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .next

      - name: Run the browser tests
        run: npm run test:e2e

      - name: Keep the report if something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            test-results
            playwright-report
          retention-days: 7
